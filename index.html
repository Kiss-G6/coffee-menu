<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>玛咖巴咖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 首页：两大分类入口（静态卡片，不读取商品JSON） -->
  <div class="home-page">
    <header>
      <h1>☕ 玛咖巴咖</h1>
    </header>
    <div class="home-card-wrap">
      <div class="home-entry-card" data-target="drink">
        <div class="entry-img-box"></div>
        <div class="entry-text">
          <h3>我想喝点</h3>
        </div>
      </div>
      <div class="home-entry-card" data-target="food">
        <div class="entry-img-box"></div>
        <div class="entry-text">
          <h3>我要吃点</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- 饮品二级页面 -->
  <div class="drink-page page-wrap" style="display: none;">
    <header>
      <div class="back-btn">← 返回首页</div>
      <h1>饮品菜单</h1>
      <div class="search-box">
        <input id="search-drink" placeholder="搜索咖啡名称、风味">
      </div>
    </header>
    <div class="category-wrap"></div>
    <div class="coffee-wrap"></div>
    <div class="popup-mask" style="display: none;"></div>
  </div>

  <!-- 小吃二级页面 -->
  <div class="food-page page-wrap" style="display: none;">
    <header>
      <div class="back-btn">← 返回首页</div>
      <h1>小食菜单</h1>
      <div class="search-box">
        <input id="search-food" placeholder="搜索小食名称、风味">
      </div>
    </header>
    <div class="food-category-wrap"></div>
    <div class="food-wrap"></div>
    <div class="food-popup-mask" style="display: none;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
