<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>玛咖巴咖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 首页：选择 饮品/美食 -->
  <div class="home-page">
    <header>
      <h1>☕ 玛咖巴咖菜单</h1>
      <div class="search-box">
        <input id="search" placeholder="搜索名称、风味">
      </div>
    </header>
    <div class="home-card-wrap">
      <div class="home-entry-card" data-target="drink">
        <div class="entry-img-box"></div>
        <div class="entry-text">
          <h3>我想喝点</h3>
        </div>
      </div>
      <div class="home-entry-card" data-target="food">
        <div class="entry-img-box"></div>
        <div class="entry-text">
          <h3>我要吃点</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- 饮品页面 -->
  <div class="page-wrap drink-page">
    <header>
      <div class="back-btn">← 返回首页</div>
      <h1>饮品菜单</h1>
      <div class="search-box">
        <input id="search-drink" placeholder="搜索咖啡名称、风味">
      </div>
    </header>
    <div class="category-wrap"></div>
    <div class="coffee-wrap"></div>
  </div>

  <!-- 美食页面 -->
  <div class="page-wrap food-page">
    <header>
      <div class="back-btn">← 返回首页</div>
      <h1>小食菜单</h1>
      <div class="search-box">
        <input id="search-food" placeholder="搜索小吃名称、风味">
      </div>
    </header>
    <div class="food-category-wrap"></div>
    <div class="coffee-wrap"></div>
  </div>

  <!-- 饮品弹窗遮罩 -->
  <div class="popup-mask">
  </div>
  <!-- 美食弹窗遮罩 -->
  <div class="food-popup-mask">
  </div>

  <script src="script.js"></script>
</body>
</html>
